        area: Computer Science
        studyType: B.Tech + MS by Research, Dual Degree (CSD)
        start_date: 2023-08
        end_date: 2028-05
        highlights:
          - "**CGPA: 8.04 / 10**"
          - Currently in the 4th year (semester 7). Expected graduation May 2028.

    Experience:
      - company: Robotics Research Center (RRC), IIIT Hyderabad
        position: Undergraduate Researcher
        location: Hyderabad, India
        start_date: 2024-05
        end_date: present
        summary: >
          Advisor: Prof. K. Madhava Krishna. Collaborator: Prof. Sourav Garg.
          Robotic perception, 3D vision, and planning & navigation.
        highlights:
          - >
            <strong>Plann3r &mdash; 3D-grounded planning costs (CoRL 2026, first author).</strong>
            Fine-tuned VGGT with a new prediction head that outputs goal-conditioned geodesic
            costmaps for navigation from single-camera RGB input; evaluated on HM3D scenes.
          - >
            Designed and ran the Plann3r rebuttal experiments, including a loop-closure extension
            addressing single-traversal assumptions, retrieval-noise sweeps, and bootstrap
            confidence intervals.
          - >
            <strong>PixelLoop &mdash; pixel-level loop closures (IROS 2026).</strong>
            Co-developed a loop-detection pipeline that adds pixel-level loop closures to
            topological navigation methods such as MASt3R-Nav, and ran its benchmark evaluation.
          - >
            <strong>Ongoing.</strong> Topological navigation, visual place recognition (VPR), and
            RGB-only last-mile docking for mobile robots.
          - >
            <strong>Deep-learning-based visual servoing (Summer 2024).</strong> Revived legacy
            codebases for the lab's RTVS and Imagine2Servo methods and built a benchmark
            evaluating them across varying viewpoint angles and query-to-goal distances.

